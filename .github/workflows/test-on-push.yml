name: Run tests
on:
  push:
    branches:
      - "*"

jobs:
  typecheck_and_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biblioteksentralen/github-actions/node-pnpm-setup@v1
        with:
          node-version: 24
      - run: npm run test-ci
      